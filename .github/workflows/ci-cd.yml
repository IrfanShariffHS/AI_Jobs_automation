name: Automation Engine CI/CD & Docker Build Pipeline

on:
  push:
    branches:
      - main
      - test
      - dev
      - prod
  pull_request:
    branches:
      - main
      - test
      - dev
      - prod

# Required permissions to publish packages to GitHub Container Registry (ghcr.io)
permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    name: Build & Test Automation Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw || true

      - name: Compile and Test Automation Service
        run: mvn test

      - name: Package Automation Service
        run: mvn package -DskipTests=true

  publish-docker-image:
    name: Build & Publish Docker Image to GitHub Packages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai_jobs_automation:latest
            ghcr.io/${{ github.repository_owner }}/ai_jobs_automation:${{ github.sha }}

  promote-environment:
    name: Environment Promotion Flow
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote to test, dev, prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Promoting main -> test..."
          git checkout -B test
          git merge origin/main --ff-only || git merge origin/main -m "Merge main into test [skip ci]"
          git push origin test

          echo "Promoting test -> dev..."
          git checkout -B dev
          git merge test --ff-only || git merge test -m "Merge test into dev [skip ci]"
          git push origin dev

          echo "Promoting dev -> prod..."
          git checkout -B prod
          git merge dev --ff-only || git merge dev -m "Merge dev into prod [skip ci]"
          git push origin prod
