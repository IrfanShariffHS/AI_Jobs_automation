name: Automation Engine CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test
      - dev
      - prod
  pull_request:
    branches:
      - main
      - test
      - dev
      - prod

jobs:
  build-and-test:
    name: Build & Test Automation Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw || true

      - name: Compile and Test Automation Service
        run: mvn test

      - name: Package Automation Service
        run: mvn package -DskipTests=true

  promote-environment:
    name: Environment Promotion Flow
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote to test, dev, prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Promoting main -> test..."
          git checkout -B test
          git merge origin/main --ff-only || git merge origin/main -m "Merge main into test [skip ci]"
          git push origin test

          echo "Promoting test -> dev..."
          git checkout -B dev
          git merge test --ff-only || git merge test -m "Merge test into dev [skip ci]"
          git push origin dev

          echo "Promoting dev -> prod..."
          git checkout -B prod
          git merge dev --ff-only || git merge dev -m "Merge dev into prod [skip ci]"
          git push origin prod
