server:
  port: 8081

spring:
  application:
    name: automation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/automation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Backend API Configuration
backend:
  api:
    url: ${BACKEND_API_URL:http://localhost:8080}
    key: ${BACKEND_API_KEY:automation-service-key}

# Encryption Key (shared with backend)
encryption:
  key: ${DB_ENCRYPTION_KEY:antigravitysec12}

logging:
  level:
    com.automation: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
